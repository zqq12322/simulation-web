name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的新推送取消上一次未完成的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Gmsh 的 Python wheel 自带原生库，但无头环境下仍需要这些系统库
      - name: 安装 Gmsh 所需的系统库
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1

      - name: 安装后端依赖
        run: pip install -r backend/requirements.txt

      - name: 运行测试（含物理回归）
        id: tests
        working-directory: backend
        # 先把输出落盘再判定成败：**失败原因要能变成注解**（见下面的步骤）。
        # Actions 的日志下载需要 admin 权限，而注解可通过公开 API 读到——
        # 第一次 CI 失败时，没有仓库权限的人完全看不到原因。
        continue-on-error: true
        run: |
          set -o pipefail
          python -m unittest discover -s tests -t . -v 2>&1 | tee ../ci-tests.log

      - name: 失败原因发成注解
        if: always()
        run: python tools/ci_annotate.py ci-tests.log --mode failures --max 25 --title "后端测试"

      - name: 测试失败则让 job 失败
        if: steps.tests.outcome == 'failure'
        run: |
          echo "后端测试失败（失败项见上面的注解）"
          exit 1

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 类型检查
        working-directory: frontend
        run: npx tsc --noEmit

      - name: 生产构建
        working-directory: frontend
        run: npm run build

  # 这个 job 才是本项目**主要证据**的所在地：`verify` 里那 133 项检查包含
  # 解析解物理校准（支反力守恒、热流 `q=kΔT/L`、模态刚体模态与二阶收敛、
  # 制造解收敛阶、导出文件的 Python 回读逐位比对）——它们**不在**单元测试里，
  # 之前也从未在 CI 上跑过。没有这个 job，"已验证"就只存在于开发者本机。
  #
  # 与上面两个 job **并行**而不是 needs：出问题时能一眼看出是单元测试挂了
  # 还是端到端挂了，而且不用排队等。
  verify:
    name: 端到端验证与物理校准
    runs-on: ubuntu-latest
    env:
      # gmsh 默认往 stdout 打大量网格信息，会把 verify 的结论淹掉
      GMSH_TERMINAL: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # verify 里的"前端纯函数自检"是**用 node 直接执行 .ts 文件**的
      # （类型擦除），需要 Node >= 23。上面的 frontend job 只做 tsc 与打包，
      # Node 20 够用；这个 job 不够。
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 Gmsh 所需的系统库
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1

      - name: 安装后端依赖
        run: pip install -r backend/requirements.txt

      # verify 里有一条"任务脚本无未定义名字"的检查靠它；
      # `tools/tasks.py` 本身只用标准库，所以它是**可选**依赖，缺了就跳过。
      # CI 装上，于是这条在 CI 上始终生效。
      - name: 安装 pyflakes（静态检查未定义名字）
        run: pip install pyflakes

      # verify 的 1/7 会跑 tsc，所以前端依赖也要装
      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      # 后端与 verify 放在**同一个 step** 里：跨 step 的后台进程能不能活下来
      # 取决于 runner 怎么处理进程组，放在一起就不必赌这件事。
      #
      # 第一次运行这个 step 是**失败的**：后端在 60 秒内没就绪（`curl` 一直连不上），
      # 而失败原因只在 job 日志里——那份日志要 admin 权限才下得下来。所以现在：
      # verify 的输出也落盘，失败时由下一步发成**注解**（公开可读）。
      - name: 启动后端并跑端到端验证
        run: |
          # pipefail 必须开：`... | tee file` 的退出码默认是 tee 的 0，
          # 那样 verify 失败会被**报告成成功**——这是最坏的一种 CI 错误。
          set -o pipefail
          cd backend
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 \
            > ci-backend.log 2>&1 &
          server_pid=$!          # 用 $! 而不是 pgrep：进程刚 fork 时 pgrep 可能还找不到
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8000/api/health > /dev/null; then
              echo "后端已就绪（第 ${attempt} 次探测）"
              break
            fi
            # 进程已经死了就不必再等：真正的死因在日志里
            if ! kill -0 "${server_pid}" 2>/dev/null; then
              echo "后端进程已退出（pid ${server_pid}），日志："
              tail -100 ci-backend.log
              exit 1
            fi
            if [ "${attempt}" = "120" ]; then
              echo "后端未在 120 秒内就绪"
              tail -100 ci-backend.log
              exit 1
            fi
            sleep 1
          done
          cd ..
          python tools/tasks.py verify 2>&1 | tee ci-verify.log

      - name: 失败原因发成注解（不用管理员权限也能看）
        if: failure()
        run: |
          echo "--- 后端启动日志尾部 ---"
          python tools/ci_annotate.py backend/ci-backend.log --mode tail --max 30 \
            --title "后端启动日志" || true
          echo "--- verify 失败项 ---"
          python tools/ci_annotate.py ci-verify.log --mode failures --max 25 \
            --title "verify 失败项" || true
